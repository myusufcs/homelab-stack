global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    lab: homelab-stack

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: app
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8000"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
